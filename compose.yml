services:
  kryptobot:
    image: oghenemalu/kyptobot
    ports:
      - "8080:8080"
    env_file:
      - .env

    depends_on:
      redis:
          condition: service_started
      postgres:
        condition: service_started
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  postgres:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: